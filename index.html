<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<title>گلی‌ایجنت</title>
<style>
:root{--bg:#F4F6F1;--ink:#12231B;--g:#1E4D3A;--r:#B8325F;--line:#D5DBD0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Vazirmatn,Tahoma,sans-serif}
#root{max-width:640px;margin:auto;padding:16px}h1{font-size:22px;margin:8px 0 12px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;margin:4px 0}
textarea{min-height:90px}button{font:inherit;border:0;border-radius:6px;padding:9px 16px;background:var(--g);color:#fff;cursor:pointer}
button.no{background:#fff;color:var(--r);border:1px solid var(--r)}button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.5}details{margin-bottom:12px}summary{cursor:pointer;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-right:4px solid var(--g);border-radius:6px;padding:12px;margin:12px 0}
.card.done{border-right-color:#7A8B80;opacity:.8}.card.err{border-right-color:var(--r)}
.f{margin:8px 0}.old{color:var(--r);text-decoration:line-through;white-space:pre-wrap;max-height:90px;overflow:auto}
.new{white-space:pre-wrap;max-height:160px;overflow:auto}.row{display:flex;gap:8px;margin-top:10px}.why{color:#52645A;font-size:13px}
</style></head><body><div id="root"></div><script type="module" src="/main.jsx"></script></body></html>
