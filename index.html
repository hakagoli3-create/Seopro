<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<title>گلی‌ایجنت</title>
<style>
:root{--bg:#F4F6F1;--card:#fff;--ink:#12231B;--mut:#52645A;--g:#1E4D3A;--gt:#fff;--r:#B8325F;--line:#D5DBD0;--ok:#2E7D55}
[data-t=d]{--bg:#0F1713;--card:#18231D;--ink:#E8EFEA;--mut:#9FB0A6;--g:#5FBF92;--gt:#0F1713;--r:#FF7A9E;--line:#2A3A31;--ok:#6FD3A0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Vazirmatn,Tahoma,sans-serif}
#root{max-width:680px;margin:auto;padding:12px 16px 84px}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line);z-index:6}.tabs button{flex:1}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:var(--card);margin:4px 0}
textarea{min-height:90px}button{font:inherit;border:0;border-radius:6px;padding:9px 16px;background:var(--g);color:var(--gt);cursor:pointer}
button.no{background:transparent;color:var(--r);border:1px solid var(--r)}button.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.5}details{margin-bottom:12px}summary{cursor:pointer;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--g);border-radius:6px;padding:12px;margin:12px 0}
.card.done{border-right-color:#7A8B80;opacity:.8}.card.err{border-right-color:var(--r)}
.f{margin:8px 0}.old{color:var(--r);text-decoration:line-through;white-space:pre-wrap;max-height:90px;overflow:auto}
.new{white-space:pre-wrap;max-height:160px;overflow:auto}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.why{color:var(--mut);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--r)}.big{font-size:44px;font-weight:700}.n{font-size:28px;font-weight:700;color:var(--g)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pv{width:100%;height:380px;border:1px solid var(--line);border-radius:6px;background:#fff}
pre.sch{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px;font-size:12px}
</style></head><body><div id="root"></div><script type="module" src="/main.jsx"></script></body></html>
